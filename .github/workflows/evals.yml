name: evals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["evals/**", "backend/src/**", ".github/workflows/evals.yml"]
  pull_request:
    types: [labeled]

defaults:
  run:
    working-directory: backend

jobs:
  # Offline suite: deterministic mock provider + mock judge, declared inside
  # evals/suite.yaml (provider.kind: mock). Free, key-less, runs everywhere.
  offline-evals:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-evals'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (with eval group)
        run: uv sync --frozen --group eval
      - name: Run offline eval suite (mock provider)
        run: uv run llm-eval run ../evals/suite.yaml --out ../evals/runs/ci-mock.json

  # Live suite: only on manual dispatch, and only if the repo has the secret
  # configured. A missing secret skips the step — it never fails the workflow.
  live-evals:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (with eval group)
        run: uv sync --frozen --group eval
      - name: Run live eval suite (DeepSeek judge; costs tokens)
        if: env.DEEPSEEK_API_KEY != ''
        run: uv run llm-eval run ../evals/suite.live.yaml --out ../evals/runs/ci-live.json
      - name: Skipped (no DEEPSEEK_API_KEY secret configured)
        if: env.DEEPSEEK_API_KEY == ''
        run: echo "DEEPSEEK_API_KEY not configured — live evals skipped."
